[tool.poetry]
name = "pythonproject5"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
  { include = "src" }
]

[tool.litestar.app]
path = "src/config/app.py"
attribute = "app"

[tool.poetry.dependencies]
python = "^3.12"
litestar = { extras = ["sqlalchemy"], version = "^2.15.2" }
litestar-granian = "^0.12.2"
litestar-asyncpg = "^0.3.0"
advanced-alchemy = "^0.20"
msgspec = "^0.19.0"
pydantic = "^2.11.3"
pydantic-settings = "^2.9.1"
bcrypt = "^4.3.0"
python-dotenv = "^1.0.1"
uvicorn = "^0.23.2"
click = ">=8.1.3,<9.0.0"
rich-click = ">=1.7.0,<2.0.0"
psycopg2-binary = "^2.9.10"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
httpx = "^0.28.1"
pytest-postgresql = "^7.0.1"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
